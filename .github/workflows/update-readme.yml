name: "Update README Article List"

on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Run update script
        run: ruby tools/update_readme.rb

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: 自动更新 README 文章目录 [skip ci]"
          file_pattern: README.md
